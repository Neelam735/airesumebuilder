<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Create your free BuildifyAi account and start building." />
    <meta name="theme-color" content="#6366F1" />
    <title>Sign Up - BuildifyAi</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
    <header class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <span class="logo-mark">⚡</span>
                <span>BuildifyAi</span>
            </a>
            <nav class="nav-links" id="navLinks">
                <a href="index.html#features">Features</a>
                <a href="index.html#pricing">Pricing</a>
                <a href="index.html#about">About</a>
                <a href="contact.html">Contact</a>
                <a href="login.html" class="btn btn-ghost">Login</a>
            </nav>
            <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
                <span></span><span></span><span></span>
            </button>
        </div>
    </header>

    <main class="auth-page">
        <div class="form-card">
            <h1>Create your account</h1>
            <p class="sub">Start building free. No credit card required.</p>

            <form id="signupForm" novalidate>
                <div class="form-status"></div>

                <div class="form-group">
                    <label for="name">Full name</label>
                    <input type="text" id="name" name="name" placeholder="Jane Doe" autocomplete="name" required />
                    <small class="error-text" id="err-name"></small>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required />
                    <small class="error-text" id="err-email"></small>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="At least 6 characters" autocomplete="new-password" required />
                    <small class="error-text" id="err-password"></small>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg">Create Account</button>
            </form>
            <p class="form-foot">Already have an account? <a href="login.html">Log in</a></p>
        </div>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
