# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy with the "Deploy to Render" button or via Render dashboard → New → Blueprint.
services:
  - type: web
    name: resume-builder-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free                       # bump to starter (~$7/mo) for no cold starts
    region: singapore                # pick the region closest to your users
    healthCheckPath: /api/v1/health
    autoDeploy: true                 # redeploy on push to the linked branch
    envVars:
      # --- Google Play Billing ---
      - key: GOOGLE_PLAY_PACKAGE_NAME
        sync: false                  # set in Render dashboard
      - key: GOOGLE_PLAY_PRODUCT_ID
        value: ai_resume_improvement
      # Path to the secret file uploaded via Render → Environment → Secret Files.
      - key: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
        value: /etc/secrets/play-service-account.json
      - key: PAYMENT_TOKEN_SIGNING_KEY
        generateValue: true          # Render generates a 32-byte random secret

      # --- Gemini ---
      - key: GEMINI_API_KEY
        sync: false                  # paste your AI Studio key in dashboard
      - key: GEMINI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_JSON_MODE
        value: "true"

      # --- CORS ---
      # Comma-separated list of frontend origins allowed to call this API.
      # Update once you know your web frontend URL.
      - key: CORS_ORIGINS
        sync: false
