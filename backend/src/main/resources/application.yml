server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: /

spring:
  application:
    name: resume-builder-backend
  jackson:
    default-property-inclusion: non_null

google-play:
  package-name: ${GOOGLE_PLAY_PACKAGE_NAME:com.neelam.resumebuilder}
  product-id: ${GOOGLE_PLAY_PRODUCT_ID:ai_resume_improvement}
  # Path to a service-account JSON file OR the JSON contents directly.
  # The service account must have the "View financial data, orders, and cancellation survey responses"
  # permission for this app in Play Console.
  service-account-json: ${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:}
  # 32+ random bytes used to HMAC-sign internal payment tokens.
  token-signing-key: ${PAYMENT_TOKEN_SIGNING_KEY:change_me_to_32_random_bytes_or_more}

razorpay:
  # From Razorpay Dashboard -> Settings -> API Keys. The secret is server-only
  # and must never be shipped in the app; only the key id reaches the client.
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
  # Charge for one AI-enhanced download, in paise (2900 = Rs. 29.00).
  amount: ${RAZORPAY_AMOUNT_PAISE:2900}
  currency: ${RAZORPAY_CURRENCY:INR}
  company-name: ${RAZORPAY_COMPANY_NAME:AI Resume Builder}
  description: ${RAZORPAY_DESCRIPTION:AI-enhanced resume download}

gemini:
  api-key: ${GEMINI_API_KEY:your_gemini_api_key}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
  model: ${GEMINI_MODEL:gemini-2.5-flash}
  json-mode: ${GEMINI_JSON_MODE:true}
  timeout-seconds: 60

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

logging:
  level:
    root: INFO
    com.resumebuilder: DEBUG
