server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: resume-builder-backend
  jackson:
    default-property-inclusion: non_null

razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_xxxxxxxxxxxx}
  key-secret: ${RAZORPAY_KEY_SECRET:your_test_secret}
  amount: ${RAZORPAY_AMOUNT:2900}
  currency: ${RAZORPAY_CURRENCY:INR}

gemini:
  api-key: ${GEMINI_API_KEY:your_gemini_api_key}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
  model: ${GEMINI_MODEL:gemini-2.5-flash}
  json-mode: ${GEMINI_JSON_MODE:true}
  timeout-seconds: 60

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

logging:
  level:
    root: INFO
    com.resumebuilder: DEBUG
