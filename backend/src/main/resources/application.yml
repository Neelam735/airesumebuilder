server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: resume-builder-backend
  jackson:
    default-property-inclusion: non_null

razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_xxxxxxxxxxxx}
  key-secret: ${RAZORPAY_KEY_SECRET:your_test_secret}
  amount: ${RAZORPAY_AMOUNT:2900}
  currency: ${RAZORPAY_CURRENCY:INR}

grok:
  api-key: ${GROK_API_KEY:xai-xxxx}
  base-url: ${GROK_BASE_URL:https://api.x.ai/v1}
  model: ${GROK_MODEL:grok-2-latest}
  timeout-seconds: 60

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

logging:
  level:
    root: INFO
    com.resumebuilder: DEBUG
