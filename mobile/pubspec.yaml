name: resume_builder
description: AI-powered resume builder with Razorpay payment and Gemini improvement.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State + storage
  provider: ^6.1.2
  shared_preferences: ^2.2.3

  # Networking
  http: ^1.2.1

  # Google Play in-app billing
  in_app_purchase: ^3.2.0
  in_app_purchase_android: ^0.3.6+8

  # PDF generation + sharing
  pdf: ^3.10.8
  printing: ^5.13.1

  # PDF text extraction (community-licensed)
  syncfusion_flutter_pdf: ^24.2.9

  # File picking
  file_picker: ^8.0.3

  # Open URLs (for "Apply with AI" → job listing)
  url_launcher: ^6.2.6

  # Useful UX bits
  flutter_markdown: ^0.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
