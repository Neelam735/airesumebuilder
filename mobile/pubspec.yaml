name: resume_builder
description: AI-powered resume builder with Razorpay payment and Gemini improvement.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State + storage
  provider: ^6.1.2
  shared_preferences: ^2.2.3

  # Networking
  http: ^1.2.1

  # Google Play in-app billing
  in_app_purchase: ^3.2.0
  in_app_purchase_android: ^0.4.0+10

  # PDF generation + sharing
  pdf: ^3.10.8
  printing: ^5.13.1

  # PDF text extraction (community-licensed)
  syncfusion_flutter_pdf: ^33.2.4

  # Word (.docx) text extraction — a .docx is a ZIP of XML parts
  archive: ^3.6.1
  xml: ^6.5.0

  # File picking (8.x exposes the FilePicker.platform.pickFiles API used here;
  # 11.x removed that accessor)
  file_picker: ^8.1.6

  # Open URLs (for "Apply with AI" → job listing)
  url_launcher: ^6.2.6

  # Sharing generated files (Word .docx) via the system share sheet
  share_plus: ^9.0.0
  path_provider: ^2.1.3

  # Useful UX bits
  flutter_markdown: ^0.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
